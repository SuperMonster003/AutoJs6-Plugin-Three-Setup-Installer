[versions]

appcompat = "1.7.1"
commons-compress = "1.28.0"
dhizuku = "2.6.0"
foojay-resolver-convention = "1.0.0"
gson = "2.13.2"
hiddenapibypass = "6.1"
junit = "4.13.2"
libsu = "6.0.0"
material = "1.13.0"
shizuku = "13.1.5"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"
xz = "1.10"

[libraries]

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
dhizuku-api = { module = "io.github.iamr0s:Dhizuku-API", version.ref = "dhizuku" }
# LSPosed AndroidHiddenApiBypass: lifts the hidden API restriction for the package installer interfaces (Apache-2.0).
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
junit = { module = "junit:junit", version.ref = "junit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# topjohnwu libsu (JitPack): root shell and the RootService that hosts the privileged installer (Apache-2.0).
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# Rikka Shizuku API: permission request, binder wrapper and the UserService that hosts the privileged installer (Apache-2.0).
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
